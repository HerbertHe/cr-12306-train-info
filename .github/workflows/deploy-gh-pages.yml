name: Build and Deploy to GitHub Pages

on:
  schedule:
    # 每天北京时间 07:20（即 UTC 前一天 23:20）
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download proxies.txt from latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download proxies-latest --repo "$GITHUB_REPOSITORY" --pattern "proxies.txt" --dir .

      - name: Install dependencies
        run: npm install

      - name: Run crawler
        run: npm run dev

      - name: Prepare dist folder
        run: |
          if [ ! -d "dist" ]; then
            echo "dist folder not found, nothing to deploy."
            exit 1
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true

